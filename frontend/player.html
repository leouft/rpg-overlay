<!DOCTYPE html>
<html>

<body>

    <h1>Painel do Jogador</h1>

    <input id="nameInput" placeholder="Nome">

    <br><br>

    <input
        id="hpInput"
        type="number"
        placeholder="HP Atual"
    >

    <input
        id="maxHpInput"
        type="number"
        placeholder="HP Máximo"
    >
    <br><br>

    <input
        id="mentalInput"
        type="number"
        placeholder="Mental Atual"
    >

    <input
        id="maxMentalInput"
        type="number"
        placeholder="Mental Máximo"
    >

    <br><br>

    <input
        id="energyInput"
        type="number"
        placeholder="Energy Atual"
    >

    <br><br>

    <button onclick="sendData()">Salvar</button>

    <script>

        const ws =
            new WebSocket("ws://localhost:8000/ws")

        function sendData() {

            const data = {

                player:
                    document.getElementById("nameInput").value,

                hp:
                    Number(
                        document.getElementById("hpInput").value
                    ),

                maxHp:
                    Number(
                        document.getElementById("maxHpInput").value
                    ),

                mental:
                    Number(
                        document.getElementById("mentalInput").value
                    ),

                maxMental:
                    Number(
                        document.getElementById("maxMentalInput").value
                    ),

                energy:
                    Number(
                        document.getElementById("energyInput").value
                    )
            }

            ws.send(JSON.stringify(data))
        }

    </script>

</body>
</html>
