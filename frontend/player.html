<!DOCTYPE html>
<html>

<body>

    <h1>Painel do Jogador</h1>

    <input id="nameInput" placeholder="Nome">

    <br><br>

    <input
        id="peCurrent"
        type="number"
        placeholder="Estresse atual"
    >

    <input
        id="peMax"
        type="number"
        placeholder="Estresse máximo"
    >
    <br><br>

    <input
        id="knockout"
        type="number"
        placeholder="Vezes fora de ação"
    >

    <br><br>

    <input
        id="courage"
        type="number"
        placeholder="Coragem"
    >

    <br><br>

    <button onclick="sendData()">Salvar</button>

    <script>

        const ws =
            new WebSocket("ws://localhost:8000/ws")

        function sendData() {

            const data = {

                player:
                    document.getElementById("nameInput").value,

                peCurrent:
                    Number(
                        document.getElementById("peCurrent").value
                    ),

                peMax:
                    Number(
                        document.getElementById("peMax").value
                    ),

                knockout:
                    Number(
                        document.getElementById("knockout").value
                    ),

                courage:
                    Number(
                        document.getElementById("courage").value
                    )
            }

            ws.send(JSON.stringify(data))
        }

    </script>

</body>
</html>
